# Copy to config.toml (which is git-ignored) and adjust.

[dictionary]
# Relative paths are resolved against the directory containing this file.
path = "dictionaries/csw24.txt"
# Used in deck names, note-type names and tags.
name = "CSW24"
# Loader to use; see rackrank.lexicon.LOADERS. "wordlist" reads one word per
# line, optionally followed by whitespace and a definition.
format = "wordlist"

# Tile distribution. Omit this table to use the standard 100-tile set.
# "?" is the blank.
[tiles]
A = 9
B = 2
C = 2
D = 4
E = 12
F = 2
G = 3
H = 2
I = 9
J = 1
K = 1
L = 4
M = 2
N = 6
O = 8
P = 2
Q = 1
R = 6
S = 4
T = 6
U = 4
V = 2
W = 2
X = 1
Y = 2
Z = 1
"?" = 2
